name: publish

# 包源发布。只在 tag 上自动触发；手动 dispatch 用于 TestPyPI 演练与补发。
#
# 包源上的版本号不可覆盖、也不可删除，所以门禁尽量前置：完整离线测试（含版本/tag/
# CHANGELOG/打包资源一致性，见 tests/test_release_metadata.py）→ 构建 sdist 与 wheel
# （两种制品在 ci.yml 的 package job 里各装一遍冒烟）→ 发布后从包源把两种制品各装一遍
# 再冒烟。任一道不过就不发布。
#
# 认证走 PyPI Trusted Publishing（OIDC），仓库里不存长期 token；PyPI 侧需要为该
# workflow 配好 trusted publisher（project / owner / repo / workflow / environment
# 五项必须与本文件一致）。一次性配置步骤见 docs/development.md §10.8。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标（演练请选 testpypi）"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 取 pyproject 声明版本
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          print("version=" + re.search(r'version = "([^"]+)"', text).group(1))
          PY
      - name: 离线测试（含发布元数据门禁）
        run: |
          python -m pip install -e ".[yaml]"
          python -m pip install "pytest>=8,<9" "pytest-cov>=5,<6"
          python -m pytest -q
      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push' || inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    # environment 名必须与 PyPI 侧 trusted publisher 里填的一致（见 §10.8）
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify-from-index:
    # 发布后立刻从包源装一遍：这一步才是「不依赖 sibling path 也能装上并跑通」
    # 的真正证据，也是发现「wheel 里少东西」的最后一道网。
    needs: [build, publish-pypi, publish-testpypi]
    # always() 不可省。实测（2026-10-19 临时探针）：needs 里的依赖被 skip 时，依赖方
    # job 会被 skip——即使它自己的 if 条件为真。tag 路径上 publish-testpypi 恒被 skip，
    # 所以少了 always() 时这道最关键的验证会在最需要它的时刻静默不执行，而整个 run
    # 仍然报成功。
    if: always() && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 从包源安装并冒烟
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ needs.publish-testpypi.result == 'success' && 'testpypi' || 'pypi' }}
        run: |
          set -euo pipefail
          # TestPyPI 只放本仓制品，依赖仍要从真 PyPI 取，故两个 index 都要给。
          INDEX_ARGS=""
          if [ "$TARGET" = "testpypi" ]; then
            INDEX_ARGS="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          fi
          python -m pip install $INDEX_ARGS "automation-kit[yaml]==$VERSION"
          python "${{ github.workspace }}/scripts/smoke_installed_package.py" "$VERSION"
      - name: 从包源装 sdist（强制源码构建）并冒烟
        # 发版上传两种制品，上面那步默认拿到的是 wheel，sdist 就没人装过。--no-binary
        # 逼 pip 下载 tarball 并现场调用 build backend 构建，这才是「包源上的 sdist
        # 可用」的证据。必须换新 venv：同一解释器里 wheel 已装，pip 会判定「已满足」
        # 而根本不构建，这一步就变成空跑。
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ needs.publish-testpypi.result == 'success' && 'testpypi' || 'pypi' }}
        run: |
          set -euo pipefail
          INDEX_ARGS=""
          if [ "$TARGET" = "testpypi" ]; then
            INDEX_ARGS="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          fi
          python -m venv sdist-venv
          ./sdist-venv/bin/python -m pip install $INDEX_ARGS \
            --no-binary automation-kit "automation-kit[yaml]==$VERSION"
          ./sdist-venv/bin/python "${{ github.workspace }}/scripts/smoke_installed_package.py" "$VERSION"
